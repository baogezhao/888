name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: baogecaiba-android-signing-v1

      - name: Build Android APK
        run: gradle -p android-app assembleDebug -PversionCode=${{ github.run_number }}

      - name: Install Dependencies
        run: npm install

      - name: Build Static Site
        run: npm run build

      - name: Add Android APK to site
        run: |
          mkdir -p dist/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/downloads/baogecaiba.apk

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
