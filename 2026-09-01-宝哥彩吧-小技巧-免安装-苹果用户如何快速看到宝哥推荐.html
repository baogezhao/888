  <div class="content"><p><span style="font-weight: bold; color: rgb(243, 63, 18);">好消息！</span><div><span style="font-weight: bold; color: rgb(243, 63, 18);">免安装，</span></div><div><span style="font-weight: bold; color: rgb(242, 59, 13);">一键就可以查看到宝哥每天的推荐！</span></div><div><br></div><div><span style="font-weight: bold; color: rgb(18, 104, 243); font-size: x-large;">对于苹果手机用户——</span></div><div><span style="font-weight: bold; color: rgb(18, 104, 243);"><br></span></div><div><span style="font-style: italic; font-weight: bold;">1、在首页右下角点击三个圆点</span></div><div><span style="font-style: italic;"><br></span></div><div><img src="./images/1788235477749-p1.jpg" alt="p1.jpg" loading="lazy" decoding="async"></div><div><br></div><div><span style="font-style: italic; font-weight: 700;">2、选择”共享“</span></div><div><span style="font-style: italic; font-weight: 700;"><br></span></div><div><img src="./images/1788235601941-p2.jpg" alt="p2.jpg" loading="lazy" decoding="async"></div><div><br></div><div><span style="font-style: italic; font-weight: 700;">3、选择”查看更多“</span></div><div><img src="./images/1788235655886-p3.jpg" alt="p3.jpg" loading="lazy" decoding="async"></div><div><br></div><div><span style="font-style: italic; font-weight: 700;">4、选择”添加到主屏幕“</span></div><div><img src="./images/1788235693324-p4.jpg" alt="p4.jpg" loading="lazy" decoding="async"><p><span style="font-style: italic; font-weight: 700;">5、把”作为网页APP打开“的按钮打开，点击”添加”</span></p><p><img src="./images/1788235793850-p5.jpg" alt="p5.jpg" loading="lazy" decoding="async"></p><p><span style="font-style: italic; font-weight: 700;">6、恭喜你，“宝哥彩吧”就出现在你的主屏幕了，一键就可以快速查看宝哥的推荐了！</span></p><p><img src="./images/1788235834636-p6.jpg" alt="p6.jpg" loading="lazy" decoding="async"></p><p><span style="font-weight: bold;">记得收藏和转发到更多好友！谢谢对宝哥的支持！</span></p></div></p>

  <div id="wechat-guide" class="wechat-guide">
    <div class="arrow">↗</div>
    <p id="wechat-guide-text"></p>
    <small>点击任意位置关闭提示</small>
  </div>
  <script>
    const shareUrl = window.location.href;
    const shareTitle = document.title;
    document.getElementById('share-weibo').href = 'https://service.weibo.com/share/share.php?url=' + encodeURIComponent(shareUrl) + '&title=' + encodeURIComponent(shareTitle);
    const isWechat = /MicroMessenger/i.test(navigator.userAgent);
    function showWechatGuide(target) {
      document.getElementById('wechat-guide-text').textContent = '请点击右上角“…”菜单，然后选择“发送给朋友”或“分享到朋友圈”。当前目标：' + target;
      document.getElementById('wechat-guide').classList.add('show');
    }
    async function copyShareUrl() {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(shareUrl); return true; } catch (error) {}
      }
      const input = document.createElement('textarea');
      input.value = shareUrl;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      input.setSelectionRange(0, input.value.length);
      const copied = document.execCommand('copy');
      document.body.removeChild(input);
      return copied;
    }
    async function shareToWechat(target) {
      if (isWechat) return showWechatGuide(target);
      if (navigator.share) {
        try {
          await navigator.share({ title: shareTitle, text: shareTitle, url: shareUrl });
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }
      const copied = await copyShareUrl();
      alert(copied ? '链接已复制，请打开微信并分享到' + target + '。' : '请长按浏览器地址栏复制链接，再打开微信分享。');
    }
    document.getElementById('share-wechat').onclick = () => shareToWechat('好友或朋友圈');
    document.getElementById('wechat-guide').onclick = event => event.currentTarget.classList.remove('show');
    document.getElementById('copy-link').onclick = async event => {
      const copied = await copyShareUrl();
      event.currentTarget.textContent = copied ? '链接已复制' : '复制失败，请长按地址栏';
    };
    document.querySelectorAll('img').forEach(image => {
      const originalUrl = image.currentSrc || image.src;
      let retries = 0;
      image.addEventListener('error', () => {
        if (retries >= 2) return;
        retries += 1;
        setTimeout(() => { image.src = originalUrl + (originalUrl.includes('?') ? '&' : '?') + 'retry=' + retries; }, retries * 1000);
      });
    });
  </script>
