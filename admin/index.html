<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地文章后台</title><style>
:root{font-family:system-ui;color:#1f2937;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:#fff;padding:14px 22px;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 52px)}aside{background:#fff;border-right:1px solid #ddd;padding:16px}section{padding:24px;max-width:960px;width:100%}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px}textarea{min-height:330px;resize:vertical;font-family:ui-monospace,monospace;line-height:1.5}label{display:block;margin-bottom:14px;font-weight:600}label span{display:block;margin-bottom:5px}button{border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:#2563eb;color:#fff}.secondary{background:#475569}.success{background:#15803d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#posts{list-style:none;padding:0}#posts button{width:100%;text-align:left;background:transparent;color:#334155;padding:8px}#posts button:hover{background:#eff6ff}#status{min-height:24px;margin-top:12px;color:#475569;white-space:pre-wrap}small{color:#64748b;font-weight:normal}@media(max-width:720px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}}
</style></head><body>
<header><strong>本地文章后台</strong><span>文件直接保存到代码库</span></header><main><aside>
<button id="newPost">＋ 新建文章</button><h3>已有文章</h3><ul id="posts"></ul></aside><section>
<label><span>标题</span><input id="title" placeholder="文章标题"></label>
<label><span>作者</span><input id="author" value="baoge"></label>
<label><span>日期</span><input id="date" type="datetime-local"></label>
<label><span>来源</span><input id="source" value="原创"></label>
<label><span>摘要 <small>可留空，由构建脚本自动截取</small></span><input id="summary"></label>
<label><span>封面图片路径</span><input id="thumbnail" placeholder="./images/example.jpg"></label>
<label><span>正文 <small>支持 Markdown</small></span><textarea id="body" placeholder="在这里写正文……"></textarea></label>
<input id="imageFile" type="file" accept="image/*" hidden><div class="actions">
<button id="insertImage" class="secondary">上传并插入图片</button><button id="save">保存草稿</button><button id="publish" class="success">保存、Commit 并 Push</button>
</div><div id="status"></div></section></main><script>
const $=id=>document.getElementById(id);let currentFilename='';
function status(message,error=false){$('status').textContent=message;$('status').style.color=error?'#b91c1c':'#475569'}
async function api(url,options){const response=await fetch(url,options);const result=await response.json();if(!response.ok)throw new Error(result.error||'操作失败');return result}
function resetEditor(){currentFilename='';['title','summary','thumbnail','body'].forEach(id=>$(id).value='');$('author').value='baoge';$('source').value='原创';const now=new Date(Date.now()-new Date().getTimezoneOffset()*60000);$('date').value=now.toISOString().slice(0,16);status('新文章')}
async function loadPosts(){const posts=await api('/api/posts');$('posts').innerHTML='';posts.forEach(post=>{const li=document.createElement('li'),button=document.createElement('button');button.textContent=post.title||post.filename;button.onclick=()=>loadPost(post.filename);li.appendChild(button);$('posts').appendChild(li)})}
async function loadPost(filename){try{const post=await api('/api/post?filename='+encodeURIComponent(filename));currentFilename=filename;['title','author','source','summary','thumbnail','body'].forEach(id=>$(id).value=post[id]||'');$('date').value=post.date?new Date(post.date).toISOString().slice(0,16):'';status('正在编辑：'+filename)}catch(error){status(error.message,true)}}
$('newPost').onclick=resetEditor;
async function savePost(){const payload={originalFilename:currentFilename};['title','author','date','source','summary','thumbnail','body'].forEach(id=>payload[id]=$(id).value);const result=await api('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});currentFilename=result.filename;await loadPosts();return result}
$('save').onclick=async()=>{try{status('正在保存……');const result=await savePost();status('已保存到 posts/'+result.filename+'，尚未发布。')}catch(error){status(error.message,true)}};
$('insertImage').onclick=()=>$('imageFile').click();$('imageFile').onchange=()=>{const file=$('imageFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{status('正在保存图片……');const result=await api('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name,data:reader.result})});const area=$('body');area.setRangeText(`![${file.name}](${result.path})`,area.selectionStart,area.selectionEnd,'end');status('图片已保存并插入正文，尚未 commit。')}catch(error){status(error.message,true)}};reader.readAsDataURL(file)};
$('publish').onclick=async()=>{const message=prompt('Commit 信息',currentFilename?'更新文章':'发布文章');if(!message)return;try{status('正在保存并发布……');await savePost();const result=await api('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});status(result.message)}catch(error){status(error.message,true)}};
resetEditor();loadPosts().catch(error=>status(error.message,true));
</script></body></html>
