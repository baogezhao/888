<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地文章后台</title>
  <style>
    :root{font-family:system-ui;color:#1f2937;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:#fff;padding:14px 22px;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 52px)}aside{background:#fff;border-right:1px solid #ddd;padding:16px}section{padding:24px;max-width:1000px;width:100%}input,textarea,select,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px}textarea{resize:vertical;min-height:130px;line-height:1.6}label{display:block;margin-bottom:14px;font-weight:600}label span{display:block;margin-bottom:5px}button{border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:#2563eb;color:#fff}.secondary{background:#475569}.success{background:#15803d}.danger{background:#b91c1c}.announcement-entry{width:100%;margin-top:10px;background:#b91c1c}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar{align-items:center;padding:8px;background:#e2e8f0;border-radius:7px 7px 0 0}.toolbar button,.toolbar select{background:#fff;color:#334155;border:1px solid #cbd5e1;border-radius:5px;padding:6px 10px}.toolbar-color{display:inline-flex;align-items:center;gap:6px;margin:0;padding:3px 8px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;color:#334155;font-size:14px}.toolbar-color input{width:30px;height:27px;padding:1px;border:0;background:transparent;cursor:pointer}.editor{min-height:360px;padding:18px;background:#fff;border:1px solid #cbd5e1;border-top:0;border-radius:0 0 7px 7px;line-height:1.7;outline:none}.editor:empty:before{content:'在这里写正文……';color:#94a3b8}.editor img{max-width:100%;height:auto}.editor:focus{box-shadow:0 0 0 2px #bfdbfe}#posts{list-style:none;padding:0}#posts button{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%;text-align:left;background:transparent;color:#334155;padding:9px 8px}#posts button:hover{background:#eff6ff}.post-name{min-width:0;overflow-wrap:anywhere}.post-views{flex:0 0 auto;border-radius:999px;padding:2px 7px;background:#f1f5f9;color:#64748b;font-size:12px;white-space:nowrap}#status{min-height:24px;margin-top:12px;color:#475569;white-space:pre-wrap}small{color:#64748b;font-weight:normal}.announcement-dialog{width:min(560px,calc(100% - 32px));border:0;border-radius:12px;padding:0;box-shadow:0 20px 60px #0005}.announcement-dialog::backdrop{background:#0008}.dialog-content{padding:24px}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog-head h2{margin:0}.dialog-close{padding:2px 9px;background:transparent;color:#64748b;font-size:26px}.checkbox{display:flex;align-items:center;gap:8px}.checkbox input{width:auto}.checkbox span{margin:0}@media(max-width:720px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}}
    .notification-entry{width:100%;margin-top:10px;background:#7c3aed}
    .tool-entry{width:100%;margin-top:10px;background:#0f766e}
    .editor{height:60vh;max-height:720px;overflow-y:auto;overscroll-behavior:contain}
    @media(max-width:720px){.editor{height:55vh;max-height:600px}}
    #notificationStatus{min-height:24px;margin-top:12px;color:#475569;white-space:pre-wrap}
    .zucai-dialog{width:min(820px,calc(100% - 32px))}.zucai-table-wrap{max-height:65vh;overflow:auto;border:1px solid #cbd5e1;border-radius:7px}.zucai-table{width:100%;border-collapse:collapse;background:#fff}.zucai-table th,.zucai-table td{padding:8px 10px;border:1px solid #cbd5e1;text-align:center;font-family:SimSun,'宋体',serif;font-size:14px}.zucai-table th{position:sticky;top:0;background:#2563eb;color:#fff}.zucai-table td:nth-child(1){background:#bfdbfe}
  </style>
</head>
<body>
  <header><strong>本地文章后台</strong><span>所见即所得编辑 · 文件直接保存到代码库</span></header>
  <main>
    <aside><button id="newPost">＋ 新建文章</button><button id="editAnnouncement" class="announcement-entry">📢 编辑首页公告</button><button id="sendNotification" class="notification-entry">🔔 手动发送通知</button><button id="openTxtConverter" class="tool-entry">📊 TXT 转 Excel</button><button id="downloadZucai" class="tool-entry">⚽ 抓取14场足彩</button><h3>已有文章</h3><ul id="posts"></ul></aside>
    <section>
      <label><span>标题</span><input id="title" placeholder="文章标题"></label>
      <label><span>作者</span><input id="author" value="宝哥"></label>
      <label><span>日期</span><input id="date" type="datetime-local"></label>
      <label><span>来源</span><input id="source" value="原创"></label>
      <label><span>摘要 <small>可留空，由构建脚本自动截取</small></span><input id="summary"></label>
      <label><span>封面图片路径 <small>留空时自动使用正文第一张图片</small></span><input id="thumbnail" placeholder="./images/example.jpg"></label>
      <label><span>正文 <small>编辑时直接显示最终效果</small></span></label>
      <div class="toolbar">
        <button data-cmd="formatBlock" data-value="h2">标题</button><button data-cmd="bold"><b>粗体</b></button><button data-cmd="italic"><i>斜体</i></button>
        <select id="fontSize" aria-label="文字字号"><option value="">字号</option><option value="2">小号</option><option value="3">正常</option><option value="4">大号</option><option value="5">特大</option><option value="6">超大</option></select>
        <label class="toolbar-color" title="文字颜色">颜色 <input id="fontColor" type="color" value="#292524" aria-label="文字颜色"></label>
        <button data-cmd="insertUnorderedList">列表</button><button id="addLink">链接</button><button id="insertImage">插入图片</button><button data-cmd="removeFormat">清除格式</button>
      </div>
      <div id="body" class="editor" contenteditable="true"></div>
      <input id="imageFile" type="file" accept="image/*" hidden>
      <div class="actions">
        <button id="preview" class="secondary">预览文章</button><button id="save">保存草稿</button><button id="publish" class="success">保存、Commit 并 Push</button><button id="delete" class="danger">删除并 Push</button>
      </div>
      <div id="status"></div>
    </section>
  </main>
  <dialog id="announcementDialog" class="announcement-dialog">
    <div class="dialog-content">
      <div class="dialog-head"><h2>首页公告</h2><button id="closeAnnouncement" class="dialog-close" aria-label="关闭">×</button></div>
      <label class="checkbox"><input id="announcementEnabled" type="checkbox"><span>在首页显示公告</span></label>
      <label><span>公告标题</span><input id="announcementTitle" placeholder="网站公告"></label>
      <label><span>公告内容</span><textarea id="announcementContent" placeholder="请输入公告内容，可换行"></textarea></label>
      <div class="actions"><button id="saveAnnouncement">保存草稿</button><button id="publishAnnouncement" class="success">保存、Commit 并 Push</button><button id="cancelAnnouncement" class="secondary">取消</button></div>
      <div id="announcementStatus"></div>
    </div>
  </dialog>
  <dialog id="notificationDialog" class="announcement-dialog">
    <div class="dialog-content">
      <div class="dialog-head"><h2>手动发送 App 通知</h2><button id="closeNotification" class="dialog-close" aria-label="关闭">×</button></div>
      <label><span>通知标题</span><input id="notificationTitle" maxlength="100" placeholder="例如：宝哥彩吧最新消息"></label>
      <label><span>通知正文</span><textarea id="notificationBody" maxlength="200" placeholder="请输入通知内容"></textarea></label>
      <label><span>点击后打开的网址</span><input id="notificationUrl" value="https://baogezhao.github.io/888/"></label>
      <div class="actions"><button id="confirmNotification" class="success">确认发送</button><button id="cancelNotification" class="secondary">取消</button></div>
      <div id="notificationStatus"></div>
    </div>
  </dialog>
  <dialog id="txtConverterDialog" class="announcement-dialog">
    <div class="dialog-content">
      <div class="dialog-head"><h2>TXT 转 Excel</h2><button id="closeTxtConverter" class="dialog-close" aria-label="关闭">×</button></div>
      <label><span>选择 TXT 文件 <small>最大 10MB</small></span><input id="txtFile" type="file" accept=".txt,text/plain,.csv,text/csv"></label>
      <label><span>文字编码</span><select id="txtEncoding"><option value="auto">自动识别 UTF-8 / GB18030</option><option value="utf-8">UTF-8</option><option value="gb18030">GB18030（常见中文 ANSI）</option></select></label>
      <label><span>分列方式</span><select id="txtDelimiter"><option value="auto">自动识别</option><option value="tab">制表符（Tab）</option><option value="comma">逗号</option><option value="pipe">竖线 |</option><option value="semicolon">分号</option><option value="space">连续空格</option></select></label>
      <label class="checkbox"><input id="txtHasHeader" type="checkbox" checked><span>第一行是表头</span></label>
      <div class="actions"><button id="convertTxt" class="success">转换并下载 Excel</button><button id="cancelTxtConverter" class="secondary">取消</button></div>
      <div id="txtConverterStatus"></div>
    </div>
  </dialog>
  <dialog id="zucaiDialog" class="announcement-dialog zucai-dialog">
    <div class="dialog-content">
      <div class="dialog-head"><h2 id="zucaiTitle">十四场足彩</h2><button id="closeZucai" class="dialog-close" aria-label="关闭">×</button></div>
      <p><small>指数：主胜 平 主负（常规时间），来源 ODDSET。空白表示未匹配或暂无可用赛前赔率。</small></p>
      <div class="zucai-table-wrap"><table class="zucai-table"><thead><tr><th>序号</th><th>赛事</th><th>主队</th><th>VS</th><th>客队</th><th title="主胜 平 主负">指数</th></tr></thead><tbody id="zucaiRows"></tbody></table></div>
      <div class="actions"><button id="copyZucai" class="success">复制表格</button><button id="cancelZucai" class="secondary">关闭</button></div>
      <div id="zucaiStatus"></div>
    </div>
  </dialog>
  <script>
    const $=id=>document.getElementById(id);let currentFilename='',savedEditorRange=null,zucaiMatches=[];
    function formatOdds(odds){if(!odds)return '';const values=[odds.home,odds.draw,odds.away];return values.every(value=>Number.isFinite(Number(value))&&Number(value)>1)?values.map(value=>Number(value).toFixed(2)).join(' '):''}
    function status(message,error=false){$('status').textContent=message;$('status').style.color=error?'#b91c1c':'#475569'}
    async function api(url,options){const response=await fetch(url,options);const result=await response.json();if(!response.ok)throw new Error(result.error||'操作失败');return result}
    function beijingDateTime(value=new Date()){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value)).replace(' ','T')}
    function resetEditor(){currentFilename='';savedEditorRange=null;['title','summary','thumbnail'].forEach(id=>$(id).value='');$('body').innerHTML='';$('author').value='宝哥';$('source').value='原创';$('date').value=beijingDateTime();status('新文章')}
    async function loadPosts(){const posts=await api('/api/posts');$('posts').innerHTML='';posts.forEach(post=>{const li=document.createElement('li'),button=document.createElement('button'),name=document.createElement('span'),views=document.createElement('span');name.className='post-name';name.textContent=post.title||post.filename;views.className='post-views';views.textContent=post.views===null?'阅读量 —':'阅读 '+post.views;button.append(name,views);button.onclick=()=>loadPost(post.filename);li.appendChild(button);$('posts').appendChild(li)})}
    async function loadPost(filename){try{const post=await api('/api/post?filename='+encodeURIComponent(filename));currentFilename=filename;savedEditorRange=null;['title','author','source','summary','thumbnail'].forEach(id=>$(id).value=post[id]||'');$('body').innerHTML=post.bodyHtml||'';$('date').value=post.date?beijingDateTime(post.date):'';status('正在编辑：'+filename)}catch(error){status(error.message,true)}}
    function articleData(){const payload={originalFilename:currentFilename,body:$('body').innerHTML};['title','author','date','source','summary','thumbnail'].forEach(id=>payload[id]=$(id).value);return payload}
    async function savePost(){const result=await api('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(articleData())});currentFilename=result.filename;await loadPosts();return result}
    async function loadAnnouncement(){const data=await api('/api/announcement');$('announcementEnabled').checked=data.enabled;$('announcementTitle').value=data.title||'网站公告';$('announcementContent').value=data.content||''}
    async function saveAnnouncement(){return api('/api/announcement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('announcementEnabled').checked,title:$('announcementTitle').value,content:$('announcementContent').value})})}
    function announcementStatus(message,error=false){$('announcementStatus').textContent=message;$('announcementStatus').style.color=error?'#b91c1c':'#475569'}
    function notificationStatus(message,error=false){$('notificationStatus').textContent=message;$('notificationStatus').style.color=error?'#b91c1c':'#475569'}
    function txtConverterStatus(message,error=false){$('txtConverterStatus').textContent=message;$('txtConverterStatus').style.color=error?'#b91c1c':'#475569'}

    $('newPost').onclick=resetEditor;
    $('editAnnouncement').onclick=async()=>{try{announcementStatus('');await loadAnnouncement();$('announcementDialog').showModal()}catch(error){status(error.message,true)}};
    $('closeAnnouncement').onclick=$('cancelAnnouncement').onclick=()=>$('announcementDialog').close();
    $('saveAnnouncement').onclick=async()=>{try{announcementStatus('正在保存……');await saveAnnouncement();announcementStatus('公告已保存到本地，尚未发布。')}catch(error){announcementStatus(error.message,true)}};
    $('publishAnnouncement').onclick=async()=>{const message=prompt('Commit 信息','更新首页公告');if(!message)return;try{announcementStatus('正在保存并发布……');await saveAnnouncement();const result=await api('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});announcementStatus(result.message)}catch(error){announcementStatus(error.message,true)}};
    $('sendNotification').onclick=()=>{notificationStatus('');if($('title').value.trim())$('notificationTitle').value=$('title').value.trim();$('notificationDialog').showModal()};
    $('closeNotification').onclick=$('cancelNotification').onclick=()=>$('notificationDialog').close();
    $('confirmNotification').onclick=async()=>{if(!confirm('确定向所有 App 用户发送这条通知吗？'))return;try{notificationStatus('正在提交通知请求……');$('confirmNotification').disabled=true;const result=await api('/api/notification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('notificationTitle').value,body:$('notificationBody').value,url:$('notificationUrl').value})});notificationStatus(result.message)}catch(error){notificationStatus(error.message,true)}finally{$('confirmNotification').disabled=false}};
    $('openTxtConverter').onclick=()=>{txtConverterStatus('');$('txtConverterDialog').showModal()};
    $('closeTxtConverter').onclick=$('cancelTxtConverter').onclick=()=>$('txtConverterDialog').close();
    function decodeTxtFile(buffer,encoding){if(encoding!=='auto')return new TextDecoder(encoding).decode(buffer);try{return new TextDecoder('utf-8',{fatal:true}).decode(buffer)}catch{return new TextDecoder('gb18030').decode(buffer)}}
    $('txtFile').onchange=()=>{const file=$('txtFile').files[0];txtConverterStatus(file?`已选择：${file.name}（${Math.ceil(file.size/1024)} KB）`:'')};
    $('convertTxt').onclick=async()=>{const file=$('txtFile').files[0];if(!file)return txtConverterStatus('请先选择 TXT 文件。',true);if(file.size>10*1024*1024)return txtConverterStatus('TXT 文件不能超过 10MB。',true);try{txtConverterStatus('正在生成 Excel……');$('convertTxt').disabled=true;const text=decodeTxtFile(await file.arrayBuffer(),$('txtEncoding').value);const response=await fetch('/api/txt-to-excel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,filename:file.name,delimiter:$('txtDelimiter').value,hasHeader:$('txtHasHeader').checked})});if(!response.ok){const result=await response.json();throw new Error(result.error||'转换失败')}const blob=await response.blob(),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=file.name.replace(/\.[^.]+$/, '')+'.xlsx';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1000);txtConverterStatus('转换完成，Excel 文件已下载。')}catch(error){txtConverterStatus(error.message,true)}finally{$('convertTxt').disabled=false}};
    $('downloadZucai').onclick=async()=>{try{status('正在抓取对阵和 ODDSET 赔率，请稍候……');$('downloadZucai').disabled=true;const result=await api('/api/zucai-matches');zucaiMatches=result.matches||[];$('zucaiTitle').textContent=`十四场足彩 · 第 ${result.issue} 期`;$('zucaiRows').innerHTML='';zucaiMatches.forEach(match=>{const row=document.createElement('tr');[match.number,match.league,match.home,match.versus,match.away,formatOdds(match.odds)].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.appendChild(cell)});$('zucaiRows').appendChild(row)});$('zucaiStatus').textContent=`已抓取 ${zucaiMatches.length} 场，点击“复制表格”后可直接粘贴到 Excel。`;const oddsInfo=result.oddsInfo;$('zucaiStatus').textContent+=' '+(oddsInfo?.error||(oddsInfo?`ODDSET: ${oddsInfo.matched}/${zucaiMatches.length} (${new Date(oddsInfo.fetchedAt).toLocaleString()})`:''));$('zucaiDialog').showModal();status(`已抓取 ${zucaiMatches.length} 场比赛。`)}catch(error){status(error.message,true)}finally{$('downloadZucai').disabled=false}};
    $('closeZucai').onclick=$('cancelZucai').onclick=()=>$('zucaiDialog').close();
    $('copyZucai').onclick=async()=>{if(!zucaiMatches.length)return;const lines=[['序号','赛事','主队','VS','客队','指数'],...zucaiMatches.map(match=>[match.number,match.league,match.home,match.versus,match.away,formatOdds(match.odds)])],text=lines.map(row=>row.join('\t')).join('\n');try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}$('zucaiStatus').textContent='复制成功，现在可以直接粘贴到 Excel。'};
    document.addEventListener('selectionchange',()=>{const selection=getSelection();if(selection.rangeCount&&$('body').contains(selection.anchorNode))savedEditorRange=selection.getRangeAt(0).cloneRange()});
    async function uploadPastedFile(file){const optimized=await optimizeImage(file);return api('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(optimized)})}
    function insertEditorHtml(html,range){$('body').focus();if(range&&$('body').contains(range.commonAncestorContainer)){const selection=getSelection();selection.removeAllRanges();selection.addRange(range)}document.execCommand('insertHTML',false,html)}
    $('body').addEventListener('paste',async event=>{
      const clipboard=event.clipboardData;if(!clipboard)return;
      const html=clipboard.getData('text/html');
      const imageFiles=Array.from(clipboard.items).filter(item=>item.kind==='file'&&item.type.startsWith('image/')).map(item=>item.getAsFile()).filter(Boolean);
      if(!html&&!imageFiles.length)return;
      event.preventDefault();
      const range=getSelection().rangeCount?getSelection().getRangeAt(0).cloneRange():savedEditorRange;
      try{
        status('正在复制文字和图片，请稍候……');
        if(!html){const uploaded=await uploadPastedFile(imageFiles[0]);insertEditorHtml(`<img src="${uploaded.path}" alt="粘贴图片" loading="lazy" decoding="async"><p><br></p>`,range);status('图片已复制到本站并插入正文，尚未发布。');return}
        const documentCopy=new DOMParser().parseFromString(html,'text/html');
        documentCopy.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(node=>node.remove());
        documentCopy.querySelectorAll('*').forEach(node=>Array.from(node.attributes).forEach(attribute=>{if(attribute.name.toLowerCase().startsWith('on'))node.removeAttribute(attribute.name)}));
        let fileIndex=0,imageCount=0;
        for(const image of documentCopy.querySelectorAll('img')){
          const source=image.getAttribute('src')||'';let uploadedPath='';
          if(source.startsWith('data:image/')){const type=(source.match(/^data:image\/([\w.+-]+)/)||[])[1]||'png';const result=await api('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:`pasted-image.${type==='jpeg'?'jpg':type}`,data:source})});uploadedPath=result.path}
          else if(source.startsWith('blob:')&&imageFiles[fileIndex]){const result=await uploadPastedFile(imageFiles[fileIndex++]);uploadedPath=result.path}
          else if(/^https?:\/\/127\.0\.0\.1(?::\d+)?\/admin\/images\//i.test(source)){uploadedPath='./images/'+decodeURIComponent(source.split('/').pop())}
          else if(/^https:\/\/baogezhao\.github\.io\/888\/images\//i.test(source)){uploadedPath='./images/'+decodeURIComponent(source.split('/').pop())}
          else if(/^https?:\/\//i.test(source)){const result=await api('/api/remote-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:source})});uploadedPath=result.path}
          if(uploadedPath){image.setAttribute('src',uploadedPath);image.setAttribute('loading','lazy');image.setAttribute('decoding','async');imageCount++}
        }
        insertEditorHtml(documentCopy.body.innerHTML,range);
        status(imageCount?`内容已粘贴，其中 ${imageCount} 张图片已复制到本站，尚未发布。`:'内容已粘贴，未检测到可复制的图片。');
      }catch(error){status('粘贴失败：'+error.message,true)}
    });
    function formatText(command,value){$('body').focus();if(savedEditorRange&&$('body').contains(savedEditorRange.commonAncestorContainer)){const selection=getSelection();selection.removeAllRanges();selection.addRange(savedEditorRange)}document.execCommand('styleWithCSS',false,true);document.execCommand(command,false,value);savedEditorRange=getSelection().rangeCount?getSelection().getRangeAt(0).cloneRange():null}
    document.querySelectorAll('[data-cmd]').forEach(button=>button.onclick=()=>formatText(button.dataset.cmd,button.dataset.value||null));
    $('fontSize').onchange=event=>{if(event.target.value)formatText('fontSize',event.target.value);event.target.value=''};
    $('fontColor').onchange=event=>formatText('foreColor',event.target.value);
    $('addLink').onclick=()=>{const url=prompt('链接地址','https://');if(url)document.execCommand('createLink',false,url)};
    $('save').onclick=async()=>{try{status('正在保存……');const result=await savePost();status('已保存到 posts/'+result.filename+'，尚未发布。')}catch(error){status(error.message,true)}};
    $('insertImage').onclick=()=>$('imageFile').click();
    function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
    async function optimizeImage(file){
      if(file.type==='image/gif'||file.type==='image/svg+xml')return{name:file.name,data:await readFile(file)};
      const source=await readFile(file),image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=source});
      const maxSize=1600,scale=Math.min(1,maxSize/Math.max(image.width,image.height));
      const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);
      const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);
      return{name:file.name.replace(/\.[^.]+$/,'.jpg'),data:canvas.toDataURL('image/jpeg',.82)};
    }
    $('imageFile').onchange=async()=>{const file=$('imageFile').files[0];if(!file)return;try{status('正在压缩并保存图片……');const optimized=await optimizeImage(file);const result=await api('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(optimized)});$('body').focus();document.execCommand('insertHTML',false,`<img src="${result.path}" alt="${file.name}" loading="lazy" decoding="async"><p><br></p>`);status('图片已压缩、保存并插入正文，尚未发布。')}catch(error){status(error.message,true)}finally{$('imageFile').value=''}};
    $('preview').onclick=()=>{const data=articleData(),win=window.open('','_blank');if(!win)return status('浏览器阻止了预览窗口，请允许弹窗。',true);const cover=data.thumbnail?`<img class="cover" src="${data.thumbnail}" alt="">`:'';win.document.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>预览：${data.title}</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px;line-height:1.7}.meta{color:#64748b;border-bottom:1px solid #ddd;padding-bottom:12px;margin-bottom:22px}img{max-width:100%;height:auto}</style></head><body><h1>${data.title||'无标题'}</h1><div class="meta">${data.author} · ${data.date} · ${data.source}</div>${cover}<article>${data.body}</article></body></html>`);win.document.close()};
    $('publish').onclick=async()=>{const message=prompt('Commit 信息',currentFilename?'更新文章':'发布文章');if(!message)return;try{status('正在保存并发布……');await savePost();const result=await api('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});status(result.message)}catch(error){status(error.message,true)}};
    $('delete').onclick=async()=>{if(!currentFilename)return status('请先选择一篇已有文章。',true);if(!confirm('确定删除这篇文章并推送到 GitHub？图片不会自动删除。'))return;const message=prompt('Commit 信息','删除文章');if(!message)return;try{status('正在删除并发布……');const result=await api('/api/post?filename='+encodeURIComponent(currentFilename),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});resetEditor();await loadPosts();status(result.message)}catch(error){status(error.message,true)}};
    resetEditor();loadPosts().catch(error=>status(error.message,true));
  </script>
</body></html>
