<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地文章后台</title>
  <style>
    :root{font-family:system-ui;color:#1f2937;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:#fff;padding:14px 22px;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 52px)}aside{background:#fff;border-right:1px solid #ddd;padding:16px}section{padding:24px;max-width:1000px;width:100%}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px}textarea{resize:vertical;min-height:130px;line-height:1.6}label{display:block;margin-bottom:14px;font-weight:600}label span{display:block;margin-bottom:5px}button{border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:#2563eb;color:#fff}.secondary{background:#475569}.success{background:#15803d}.danger{background:#b91c1c}.announcement-entry{width:100%;margin-top:10px;background:#b91c1c}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar{padding:8px;background:#e2e8f0;border-radius:7px 7px 0 0}.toolbar button{background:#fff;color:#334155;border:1px solid #cbd5e1;padding:6px 10px}.editor{min-height:360px;padding:18px;background:#fff;border:1px solid #cbd5e1;border-top:0;border-radius:0 0 7px 7px;line-height:1.7;outline:none}.editor:empty:before{content:'在这里写正文……';color:#94a3b8}.editor img{max-width:100%;height:auto}.editor:focus{box-shadow:0 0 0 2px #bfdbfe}#posts{list-style:none;padding:0}#posts button{width:100%;text-align:left;background:transparent;color:#334155;padding:8px}#posts button:hover{background:#eff6ff}#status{min-height:24px;margin-top:12px;color:#475569;white-space:pre-wrap}small{color:#64748b;font-weight:normal}.announcement-dialog{width:min(560px,calc(100% - 32px));border:0;border-radius:12px;padding:0;box-shadow:0 20px 60px #0005}.announcement-dialog::backdrop{background:#0008}.dialog-content{padding:24px}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog-head h2{margin:0}.dialog-close{padding:2px 9px;background:transparent;color:#64748b;font-size:26px}.checkbox{display:flex;align-items:center;gap:8px}.checkbox input{width:auto}.checkbox span{margin:0}@media(max-width:720px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}}
  </style>
</head>
<body>
  <header><strong>本地文章后台</strong><span>所见即所得编辑 · 文件直接保存到代码库</span></header>
  <main>
    <aside><button id="newPost">＋ 新建文章</button><button id="editAnnouncement" class="announcement-entry">📢 编辑首页公告</button><h3>已有文章</h3><ul id="posts"></ul></aside>
    <section>
      <label><span>标题</span><input id="title" placeholder="文章标题"></label>
      <label><span>作者</span><input id="author" value="宝哥"></label>
      <label><span>日期</span><input id="date" type="datetime-local"></label>
      <label><span>来源</span><input id="source" value="原创"></label>
      <label><span>摘要 <small>可留空，由构建脚本自动截取</small></span><input id="summary"></label>
      <label><span>封面图片路径 <small>留空时自动使用正文第一张图片</small></span><input id="thumbnail" placeholder="./images/example.jpg"></label>
      <label><span>正文 <small>编辑时直接显示最终效果</small></span></label>
      <div class="toolbar">
        <button data-cmd="formatBlock" data-value="h2">标题</button><button data-cmd="bold"><b>粗体</b></button><button data-cmd="italic"><i>斜体</i></button>
        <button data-cmd="insertUnorderedList">列表</button><button id="addLink">链接</button><button id="insertImage">插入图片</button><button data-cmd="removeFormat">清除格式</button>
      </div>
      <div id="body" class="editor" contenteditable="true"></div>
      <input id="imageFile" type="file" accept="image/*" hidden>
      <div class="actions">
        <button id="preview" class="secondary">预览文章</button><button id="save">保存草稿</button><button id="publish" class="success">保存、Commit 并 Push</button><button id="delete" class="danger">删除并 Push</button>
      </div>
      <div id="status"></div>
    </section>
  </main>
  <dialog id="announcementDialog" class="announcement-dialog">
    <div class="dialog-content">
      <div class="dialog-head"><h2>首页公告</h2><button id="closeAnnouncement" class="dialog-close" aria-label="关闭">×</button></div>
      <label class="checkbox"><input id="announcementEnabled" type="checkbox"><span>在首页显示公告</span></label>
      <label><span>公告标题</span><input id="announcementTitle" placeholder="网站公告"></label>
      <label><span>公告内容</span><textarea id="announcementContent" placeholder="请输入公告内容，可换行"></textarea></label>
      <div class="actions"><button id="saveAnnouncement">保存草稿</button><button id="publishAnnouncement" class="success">保存、Commit 并 Push</button><button id="cancelAnnouncement" class="secondary">取消</button></div>
      <div id="announcementStatus"></div>
    </div>
  </dialog>
  <script>
    const $=id=>document.getElementById(id);let currentFilename='';
    function status(message,error=false){$('status').textContent=message;$('status').style.color=error?'#b91c1c':'#475569'}
    async function api(url,options){const response=await fetch(url,options);const result=await response.json();if(!response.ok)throw new Error(result.error||'操作失败');return result}
    function beijingDateTime(value=new Date()){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value)).replace(' ','T')}
    function resetEditor(){currentFilename='';['title','summary','thumbnail'].forEach(id=>$(id).value='');$('body').innerHTML='';$('author').value='宝哥';$('source').value='原创';$('date').value=beijingDateTime();status('新文章')}
    async function loadPosts(){const posts=await api('/api/posts');$('posts').innerHTML='';posts.forEach(post=>{const li=document.createElement('li'),button=document.createElement('button');button.textContent=post.title||post.filename;button.onclick=()=>loadPost(post.filename);li.appendChild(button);$('posts').appendChild(li)})}
    async function loadPost(filename){try{const post=await api('/api/post?filename='+encodeURIComponent(filename));currentFilename=filename;['title','author','source','summary','thumbnail'].forEach(id=>$(id).value=post[id]||'');$('body').innerHTML=post.bodyHtml||'';$('date').value=post.date?beijingDateTime(post.date):'';status('正在编辑：'+filename)}catch(error){status(error.message,true)}}
    function articleData(){const payload={originalFilename:currentFilename,body:$('body').innerHTML};['title','author','date','source','summary','thumbnail'].forEach(id=>payload[id]=$(id).value);return payload}
    async function savePost(){const result=await api('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(articleData())});currentFilename=result.filename;await loadPosts();return result}
    async function loadAnnouncement(){const data=await api('/api/announcement');$('announcementEnabled').checked=data.enabled;$('announcementTitle').value=data.title||'网站公告';$('announcementContent').value=data.content||''}
    async function saveAnnouncement(){return api('/api/announcement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('announcementEnabled').checked,title:$('announcementTitle').value,content:$('announcementContent').value})})}
    function announcementStatus(message,error=false){$('announcementStatus').textContent=message;$('announcementStatus').style.color=error?'#b91c1c':'#475569'}

    $('newPost').onclick=resetEditor;
    $('editAnnouncement').onclick=async()=>{try{announcementStatus('');await loadAnnouncement();$('announcementDialog').showModal()}catch(error){status(error.message,true)}};
    $('closeAnnouncement').onclick=$('cancelAnnouncement').onclick=()=>$('announcementDialog').close();
    $('saveAnnouncement').onclick=async()=>{try{announcementStatus('正在保存……');await saveAnnouncement();announcementStatus('公告已保存到本地，尚未发布。')}catch(error){announcementStatus(error.message,true)}};
    $('publishAnnouncement').onclick=async()=>{const message=prompt('Commit 信息','更新首页公告');if(!message)return;try{announcementStatus('正在保存并发布……');await saveAnnouncement();const result=await api('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});announcementStatus(result.message)}catch(error){announcementStatus(error.message,true)}};
    document.querySelectorAll('[data-cmd]').forEach(button=>button.onclick=()=>{document.execCommand(button.dataset.cmd,false,button.dataset.value||null);$('body').focus()});
    $('addLink').onclick=()=>{const url=prompt('链接地址','https://');if(url)document.execCommand('createLink',false,url)};
    $('save').onclick=async()=>{try{status('正在保存……');const result=await savePost();status('已保存到 posts/'+result.filename+'，尚未发布。')}catch(error){status(error.message,true)}};
    $('insertImage').onclick=()=>$('imageFile').click();
    function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
    async function optimizeImage(file){
      if(file.type==='image/gif'||file.type==='image/svg+xml')return{name:file.name,data:await readFile(file)};
      const source=await readFile(file),image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=source});
      const maxSize=1600,scale=Math.min(1,maxSize/Math.max(image.width,image.height));
      const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);
      const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);
      return{name:file.name.replace(/\.[^.]+$/,'.jpg'),data:canvas.toDataURL('image/jpeg',.82)};
    }
    $('imageFile').onchange=async()=>{const file=$('imageFile').files[0];if(!file)return;try{status('正在压缩并保存图片……');const optimized=await optimizeImage(file);const result=await api('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(optimized)});$('body').focus();document.execCommand('insertHTML',false,`<img src="${result.path}" alt="${file.name}" loading="lazy" decoding="async"><p><br></p>`);status('图片已压缩、保存并插入正文，尚未发布。')}catch(error){status(error.message,true)}finally{$('imageFile').value=''}};
    $('preview').onclick=()=>{const data=articleData(),win=window.open('','_blank');if(!win)return status('浏览器阻止了预览窗口，请允许弹窗。',true);const cover=data.thumbnail?`<img class="cover" src="${data.thumbnail}" alt="">`:'';win.document.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>预览：${data.title}</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px;line-height:1.7}.meta{color:#64748b;border-bottom:1px solid #ddd;padding-bottom:12px;margin-bottom:22px}img{max-width:100%;height:auto}</style></head><body><h1>${data.title||'无标题'}</h1><div class="meta">${data.author} · ${data.date} · ${data.source}</div>${cover}<article>${data.body}</article></body></html>`);win.document.close()};
    $('publish').onclick=async()=>{const message=prompt('Commit 信息',currentFilename?'更新文章':'发布文章');if(!message)return;try{status('正在保存并发布……');await savePost();const result=await api('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});status(result.message)}catch(error){status(error.message,true)}};
    $('delete').onclick=async()=>{if(!currentFilename)return status('请先选择一篇已有文章。',true);if(!confirm('确定删除这篇文章并推送到 GitHub？图片不会自动删除。'))return;const message=prompt('Commit 信息','删除文章');if(!message)return;try{status('正在删除并发布……');const result=await api('/api/post?filename='+encodeURIComponent(currentFilename),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});resetEditor();await loadPosts();status(result.message)}catch(error){status(error.message,true)}};
    resetEditor();loadPosts().catch(error=>status(error.message,true));
  </script>
</body></html>
